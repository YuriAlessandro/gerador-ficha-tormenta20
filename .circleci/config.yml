version: 2.1

orbs:
  node: circleci/node@5.2.0

jobs:
  build:
    docker:
      # Espelha o ambiente local de dev (node 22 + npm 11). O npm precisa ser
      # >= 11 porque o package-lock.json é gerado pelo npm 11, e o npm 10
      # rejeita o lock no `npm ci` ("Missing: yaml@x.y.z from lock file") por
      # divergência no tratamento de peer deps opcionais.
      - image: cimg/node:22.21.1
    steps:
      - checkout
      # O código core importa src/premium (submódulo PRIVADO) em ~173 pontos, e
      # o `checkout` do CircleCI não inicializa submódulos.
      #
      # Dois cenários, um job só:
      #
      # 1. Branch/PR do próprio repo: o CircleCI expõe as variáveis do projeto,
      #    então GITHUB_PAT existe e o submódulo é clonado -> suíte COMPLETA
      #    (187 suítes).
      # 2. PR de fork: o CircleCI NÃO passa segredos para builds de fork (e não
      #    deve — o PR poderia imprimi-los). GITHUB_PAT chega vazio, o submódulo
      #    fica ausente e o vitest.config.ts detecta isso sozinho, redirecionando
      #    os imports para o stub público de src/premium-stub -> suíte PÚBLICA
      #    (130 suítes; as que dependem de lógica premium ficam de fora, ver a
      #    lista PREMIUM_DEPENDENT_TESTS em vitest.config.ts).
      #
      # Para o cenário 2 aparecer no PR é preciso ligar "Build forked pull
      # requests" em Project Settings > Advanced. NÃO ligar "Pass secrets to
      # builds from forked pull requests": isso vazaria o PAT.
      #
      # O PAT é um GitHub fine-grained token com leitura (Contents) no repo
      # fichas-de-nimb-premium, em Project Settings > Environment Variables.
      - run:
          name: Init premium submodule
          command: |
            if [ -z "${GITHUB_PAT}" ]; then
              echo "GITHUB_PAT ausente (PR de fork ou variável não configurada)."
              echo "Rodando em modo stub público — src/premium-stub cobre os imports."
              exit 0
            fi
            git config --global url."https://${GITHUB_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule update --init src/premium
      # A imagem cimg/node:22.x embute npm 10.x; sobe pro 11 (mesmo do dev local)
      - run:
          name: Use npm 11
          command: sudo npm install -g npm@11
      - node/install-packages:
          pkg-manager: npm
          cache-version: v4
      - run:
          name: Report test mode
          command: |
            if [ -f src/premium/index.ts ]; then
              echo "Submódulo premium presente -> suíte completa."
            else
              echo "Sem submódulo premium -> suíte pública (stub)."
            fi
      - run:
          name: Run Tests
          command: npm test

workflows:
  build_and_test:
    jobs:
      - build:
          filters:
            branches:
              ignore:
                - gh-pages
